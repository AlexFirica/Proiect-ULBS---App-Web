<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codero - În curând</title>
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/theme.css">
  <script src="/js/theme-toggle.js"></script>
</head>
<body>
  <div class="app-container">

    <aside class="sidebar">
      <div class="logo-section">
        <span class="logo-icon">&lt;/&gt;</span>
        <span class="logo-text">Codero</span>
      </div>
      <nav class="nav-menu">
        <a href="#" id="back-to-dashboard" class="nav-item">
          <span class="icon">🏠</span> Dashboard
        </a>
      </nav>
    </aside>

    <div class="main-wrapper">
      <header class="top-header">
        <div class="top-nav-links">
          <span class="top-link active" id="feature-name">Funcționalitate</span>
        </div>
        <div class="user-profile">
          <div class="user-avatar">👤</div>
          <div class="user-info">
            <span class="user-name"></span>
            <span class="user-role"></span>
          </div>
        </div>
      </header>

      <main class="content-body" style="display:flex; align-items:center; justify-content:center; min-height:60vh;">
        <div style="text-align:center; max-width:420px;">
          <div style="font-size:56px; margin-bottom:16px;">🚧</div>
          <h2 id="feature-title" style="margin-bottom:8px;">În curând</h2>
          <p style="color:#64748b;">Lucrăm la această funcționalitate. Revino în curând — o vom lansa cât mai repede posibil!</p>
          <button id="back-btn" class="btn-primary" style="margin-top:20px;">← Înapoi la Dashboard</button>
        </div>
      </main>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const savedUser = localStorage.getItem('user');
      const token = localStorage.getItem('token');
      if (!savedUser || !token) {
        window.location.href = '/login.html';
        return;
      }
      const user = JSON.parse(savedUser);
      const normalizedRole = (user.role || '').toLowerCase();
      const isTeacher = normalizedRole === 'teacher' || normalizedRole === 'profesor';
      const dashboardUrl = isTeacher ? '/dashboard-teacher.html' : '/dashboard-student.html';

      document.querySelector('.user-name').textContent = user.name || user.email;
      document.querySelector('.user-role').textContent = isTeacher ? 'profesor' : 'elev';
      document.getElementById('back-to-dashboard').href = dashboardUrl;

      const params = new URLSearchParams(window.location.search);
      const featureName = params.get('f') || 'Această secțiune';
      document.getElementById('feature-name').textContent = featureName;
      document.getElementById('feature-title').textContent = `${featureName} — în curând`;

      document.getElementById('back-btn').addEventListener('click', () => {
        window.location.href = dashboardUrl;
      });
    });
  </script>
</body>
</html>
