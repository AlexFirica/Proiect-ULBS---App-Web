<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avatar Studio - Bac & C++ Academy</title>
<style>
*{box-sizing:border-box}
body{background:#0f172a;color:#f8fafc;font-family:'Segoe UI',Tahoma,sans-serif;margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.app{display:flex;flex-wrap:wrap;gap:28px;background:#1e293b;padding:28px;border-radius:20px;border:1px solid #334155;box-shadow:0 10px 25px rgba(0,0,0,.5);max-width:1000px;width:100%}
.left{display:flex;flex-direction:column;align-items:center;gap:12px;width:270px;margin:0 auto}
.card{width:100%;display:flex;flex-direction:column;align-items:center;background:linear-gradient(145deg,#1e1b4b,#312e81);padding:16px;border-radius:16px;border:2px solid var(--fc,#6366f1);box-shadow:0 0 22px var(--fc,#6366f1)}
.badge{background:#818cf8;color:#0f172a;font-weight:700;padding:4px 12px;border-radius:20px;font-size:12px;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
.stage{width:230px;height:230px}
.frame{position:relative;width:100%;height:100%;border-radius:22px;overflow:hidden;border:4px solid var(--fc,#a855f7);box-shadow:0 0 16px var(--fc,#a855f7);background:#0f172a}
.layer{overflow:visible;position:absolute;inset:0;width:100%;height:100%;pointer-events:none;filter:drop-shadow(0 2px 2px #0008)}
#av{position:absolute;display:block;-webkit-mask-image:linear-gradient(to bottom,#000 84%,transparent 100%);mask-image:linear-gradient(to bottom,#000 84%,transparent 100%)}
#ov-pet{animation:bob 2.4s ease-in-out infinite;position:absolute;line-height:1;filter:drop-shadow(0 2px 2px #0008)}
.pname{margin-top:14px;font-weight:700;font-size:18px}
.ptitle{font-size:12px;color:#fbbf24;min-height:16px}
.xpbar{width:100%;height:8px;background:#0f172a;border-radius:6px;margin-top:10px;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#6366f1,#a855f7);width:0}
.xptxt{font-size:11px;color:#94a3b8;margin-top:4px}
.right{flex:1;min-width:300px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.coins{background:#0f172a;border:1px solid #f59e0b;color:#fbbf24;padding:6px 14px;border-radius:20px;font-weight:700}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{background:#0f172a;border:1px solid #475569;color:#cbd5e1;padding:6px 10px;border-radius:8px;font-size:13px;cursor:pointer}
.tab.on{background:#6366f1;border-color:#6366f1;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;max-height:330px;overflow-y:auto;padding:2px}
.item{background:#0f172a;border:2px solid var(--rc);border-radius:10px;padding:8px 6px;text-align:center;cursor:pointer;font-size:12px;transition:transform .1s}
.item:hover{transform:translateY(-2px)}
.item.sel{box-shadow:0 0 0 2px #fff,0 0 12px var(--rc)}
.item .th{height:60px;display:flex;align-items:center;justify-content:center;font-size:34px}
.item .th img{width:60px;height:60px;border-radius:8px}
.item .nm{margin-top:4px;font-weight:600;min-height:30px}
.item .pr{color:#fbbf24;font-size:11px}.item .pr.own{color:#4ade80}.item .pr.lock{color:#f87171}
.swatches{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid #475569;cursor:pointer}
.sw.sel{border-color:#fff;box-shadow:0 0 8px #fff}
.sec{font-size:12px;color:#94a3b8;margin:6px 0 4px}
button{padding:9px 12px;border-radius:8px;border:none;color:#fff;font-weight:700;cursor:pointer;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.b-reset{background:#475569}.b-buy{background:#16a34a}.b-rand{background:#d97706}.b-save{background:#2563eb}.b-day{background:#7c3aed}.b-bat{background:#dc2626}
button:hover{filter:brightness(.88)}
.left button{width:100%}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;border:1px solid #6366f1;padding:10px 18px;border-radius:10px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
#toast.show{opacity:1}
@keyframes bob{50%{transform:translateY(-3px)}}
</style>
</head>
<body>
<div class="app">
  <div class="left">
    <div class="card" id="card">
      <div class="badge" id="badge"></div>
      <div class="stage"><div class="frame" id="frame">
        <svg class="layer" id="ov-body" viewBox="0 0 100 100"></svg>
        <img id="av" alt="Avatar">
        <svg class="layer" id="ov-neck" viewBox="0 0 100 100"></svg>
        <svg class="layer" id="ov-clothing" viewBox="0 0 100 100"></svg>
        <svg class="layer" id="ov-face" viewBox="0 0 100 100"></svg>
        <svg class="layer" id="ov-hand" viewBox="0 0 100 100"></svg>
        <div id="ov-pet"></div>
      </div></div>
      <div class="pname">Student_01</div>
      <div class="ptitle" id="ptitle"></div>
      <div class="xpbar"><i id="xpfill"></i></div>
      <div class="xptxt" id="xptxt"></div>
    </div>
    <button class="b-day" onclick="daily()">📅 Daily login (<span id="streak">0</span> zile)</button>
    <button class="b-bat" onclick="battle()">⚔️ Simulează bătălie 1v1</button>
  </div>
  <div class="right">
    <div class="top"><div class="tabs" id="tabs"></div><div class="coins">🪙 <span id="coins">0</span></div></div>
    <div id="panel"></div>
    <div class="row">
      <button class="b-buy" id="buyBtn" onclick="buyAll()">🛒 Cumpără</button>
      <button class="b-rand" onclick="randomize()">🎲 Random</button>
      <button class="b-reset" onclick="resetPreview()">↩ Resetează</button>
      <button class="b-save" onclick="save()">💾 Salvează</button>
    </div>
  </div>
</div>
<div id="toast"></div>

function load(){try{const s=JSON.parse(localStorage.getItem('avatarStudio4'));if(s&&s.equip)return s}catch(e){}
  return {...JSON.parse(JSON.stringify(DEF)),coins:500,xp:0,streak:0,last:'',owned:[]}}
function persist(){try{localStorage.setItem('avatarStudio4',JSON.stringify(S))}catch(e){}}
const find=(slot,id)=>SLOTS[slot].items.find(i=>i.id===id)||SLOTS[slot].items[0];
const level=()=>Math.floor(S.xp/100)+1;
const rankName=l=>l>=9?'Arhimag':l>=6?'Cavaler':l>=3?'Ucenic':'Novice';
const owned=i=>i.p===0||S.owned.includes(i.id);
const locked=i=>i.lvl&&level()<i.lvl;

function avatarUrl(eq,c,over){
  const p=new URLSearchParams({seed:'student',skinColor:c.skin,hairColor:c.hairColor,glassesProbability:0,earringsProbability:0,featuresProbability:0});
  ['hair','eyebrows','eyes','mouth','glasses','earrings','features'].forEach(k=>{
    const id=(over&&over[0]===k)?over[1]:eq[k];const v=find(k,id).v;
    if(k==='glasses'||k==='earrings'||k==='features'){if(v&&(k!=='glasses'||/^variant/.test(v))){p.set(k,v);p.set(k+'Probability',100)}}
    else p.set(k,v)});
  return 'https://api.dicebear.com/9.x/adventurer/svg?'+p.toString();
}
function faceTf(){const a=POS.avatar,f=POS.face,k=a.scale/80;
  return 'translate('+((100-a.scale)/2+a.scale*.3875+f.x)+' '+(a.top+a.scale*.524+f.y)+') rotate(-3) scale('+(k*f.s)+')'}
function bodySVG(skin){const c='#'+skin;
  return '<path d="M16 112 L16 99 Q18 83 37 76 L63 76 Q82 83 84 99 L84 112Z" fill="'+c+'"/><rect x="42" y="48" width="16" height="36" rx="7" fill="'+c+'"/><ellipse cx="50" cy="76" rx="9" ry="4" fill="#000" opacity=".18"/><path d="M34 76 Q50 84 66 76" fill="none" stroke="#000" stroke-opacity=".12" stroke-width="1.5"/>'}
function neckSVG(skin){const t=70-POS.body.y;
  return '<clipPath id="nk"><path d="M42.5 '+t+' H57.5 L58.5 '+(t+24)+' H41.5Z"/></clipPath><g clip-path="url(#nk)"><rect x="40" y="'+t+'" width="20" height="30" fill="#'+skin+'"/><ellipse cx="50" cy="'+(t-1)+'" rx="10" ry="4.5" fill="#000" opacity=".2"/></g>'}
function applyPos(){
  const a=POS.avatar,img=$('av');
  img.style.width=img.style.height=a.scale+'%';img.style.left=(100-a.scale)/2+'%';img.style.top=a.top+'%';
  ['ov-body','ov-neck','ov-clothing'].forEach(i=>$(i).style.transform='translateY('+POS.body.y+'%)');
  ['hand'].forEach(k=>{const p=POS[k],e=$('ov-'+k);e.style.transformOrigin=ORG[k];e.style.transform='translate('+p.x+'%,'+p.y+'%) scale('+p.s+')'});
  const pe=$('ov-pet');pe.style.left=POS.pet.x+'%';pe.style.bottom=POS.pet.y+'%';pe.style.fontSize=POS.pet.size+'px';
}
let lastTab=null;
function render(){
  const ws=window.scrollY;
  $('av').src=avatarUrl(preview,pv);
  $('ov-body').innerHTML=bodySVG(pv.skin);$('ov-neck').innerHTML=neckSVG(pv.skin);
  $('frame').style.background='linear-gradient(165deg,#'+pv.bg+',#0f172a)';
  const fr=find('frame',preview.frame).v;
  $('card').style.setProperty('--fc',fr);$('frame').style.setProperty('--fc',fr);
  ['clothing','hand'].forEach(k=>{$('ov-'+k).innerHTML=find(k,preview[k]).v||''});
  const gl=find('glasses',preview.glasses).v;$('ov-face').innerHTML=(gl&&!/^variant/.test(gl))?'<g transform="'+faceTf()+'">'+gl+'</g>':'';
  $('ov-pet').textContent=find('pet',preview.pet).v||'';
  $('ptitle').textContent=find('title',preview.title).v||'';
  const l=level();$('badge').textContent='Lvl '+l+' • '+rankName(l);
  $('xpfill').style.width=(S.xp%100)+'%';$('xptxt').textContent=(S.xp%100)+' / 100 XP';
  $('coins').textContent=S.coins;$('streak').textContent=S.streak;
  applyPos();renderTabs();renderPanel();updateBuy();window.scrollTo(0,ws);
}
function renderTabs(){const t=$('tabs');t.innerHTML='';
  [...Object.keys(SLOTS),'colors'].forEach(k=>{const b=document.createElement('div');b.className='tab'+(k===tab?' on':'');
    b.textContent=k==='colors'?'🎨 Culori':SLOTS[k].label;b.onclick=()=>{tab=k;renderTabs();renderPanel()};t.appendChild(b)})}
function renderPanel(){
  const p=$('panel'),old=p.querySelector('.grid'),gs=(old&&tab===lastTab)?old.scrollTop:0;lastTab=tab;p.innerHTML='';
  if(tab==='colors'){COLORS.forEach(g=>{
    p.insertAdjacentHTML('beforeend','<div class="sec">'+g.label+' (gratuit)</div>');
    const w=document.createElement('div');w.className='swatches';
    g.list.forEach(c=>{const d=document.createElement('div');d.className='sw'+(pv[g.key]===c?' sel':'');d.style.background='#'+c;d.onclick=()=>{pv[g.key]=c;render()};w.appendChild(d)});
    p.appendChild(w)});return}
  const sl=SLOTS[tab],g=document.createElement('div');g.className='grid';
  sl.items.forEach(i=>{
    const d=document.createElement('div');d.className='item'+(preview[tab]===i.id?' sel':'');d.style.setProperty('--rc',R[i.r].c);
    const isOv=tab==='glasses'&&i.v&&!/^variant/.test(i.v);
    const th=(sl.param&&!isOv)?'<img loading="lazy" src="'+avatarUrl(preview,pv,[tab,i.id])+'">':tab==='pet'?(i.v||'∅'):(sl.frame||sl.title)?i.e:(i.v?'<svg viewBox="'+TV[tab]+'" width="70" height="46">'+i.v+'</svg>':'∅');
    const pr=locked(i)?'<div class="pr lock">🔒 Nivel '+i.lvl+'</div>':(S.equip[tab]===i.id&&i.id!=='none')?'<div class="pr own">✔ Echipat</div>':owned(i)?'<div class="pr own">✔ '+(i.p===0&&i.id!=='none'?'Gratuit':'Deținut')+'</div>':'<div class="pr">🪙 '+i.p+'</div>';
    d.innerHTML='<div class="th">'+th+'</div><div class="nm">'+i.name+'</div>'+pr;
    d.onclick=()=>{preview[tab]=i.id;render()};g.appendChild(d)});
  p.appendChild(g);g.scrollTop=gs;
}
const unowned=()=>Object.keys(SLOTS).map(s=>find(s,preview[s])).filter(i=>!owned(i)&&!locked(i));
function updateBuy(){const u=unowned(),c=u.reduce((a,i)=>a+i.p,0),b=$('buyBtn');b.style.display=u.length?'':'none';b.textContent='🛒 Cumpără ('+u.length+') • 🪙 '+c}
function buyAll(){const u=unowned(),c=u.reduce((a,i)=>a+i.p,0);
  if(c>S.coins)return toast('Nu ai destule monede! Fă daily login sau câștigă o bătălie.');
  S.coins-=c;u.forEach(i=>S.owned.push(i.id));persist();toast('Ai cumpărat '+u.length+' item-uri! 🎉');render()}
function save(){
  if(unowned().length)return toast('Cumpără mai întâi item-urile nedeținute.');
  if(Object.keys(SLOTS).some(s=>locked(find(s,preview[s]))))return toast('Ai item-uri blocate de nivel.');
  S.equip={...preview};S.skin=pv.skin;S.hairColor=pv.hairColor;S.bg=pv.bg;persist();
  try{localStorage.setItem('avatarUrl',avatarUrl(S.equip,{skin:S.skin,hairColor:S.hairColor,bg:S.bg}));localStorage.setItem('avatarBg',S.bg)}catch(e){}
  const userId=localStorage.getItem('userId')||'USER_ID_DEMO';
  fetch('/api/gamification/avatar',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({userId,avatarConfig:{equip:S.equip,skin:S.skin,hairColor:S.hairColor,bg:S.bg}})}).catch(()=>{});
  toast('Avatarul a fost salvat pe profilul tău! 💾');
}
function resetPreview(){preview={...S.equip};pv={skin:S.skin,hairColor:S.hairColor,bg:S.bg};render();toast('Ai revenit la avatarul salvat.')}
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function randomize(){
  Object.keys(SLOTS).forEach(k=>{preview[k]=rnd(SLOTS[k].items.filter(i=>!locked(i)&&owned(i))).id});
  pv.skin=rnd(SKIN);pv.hairColor=rnd(HAIRC);pv.bg=rnd(BG);render()}
function gain(xp,coins){const b=level();S.xp+=xp;S.coins+=coins;persist();if(level()>b)toast('🎉 Level up! Nivel '+level()+' – verifică item-urile de rang noi!');render()}
function daily(){const today=new Date().toDateString();if(S.last===today)return toast('Ai luat deja bonusul de azi. Revino mâine!');
  const y=new Date(Date.now()-864e5).toDateString();S.streak=S.last===y?S.streak+1:1;S.last=today;
  const bonus=S.streak%7===0?200:50+Math.min(S.streak,6)*10;gain(20,bonus);toast('Daily login: +'+bonus+' 🪙 (streak '+S.streak+')')}
function battle(){const a=Math.floor(Math.random()*6)+4,b=Math.floor(Math.random()*7)+3;
  if(a>b){gain(40,90);toast('⚔️ Victorie '+a+'–'+b+'! +40 XP, +90 🪙')}else{gain(10,20);toast('⚔️ Înfrângere '+a+'–'+b+'. +10 XP, +20 🪙')}}
let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2600)}
render();
</script>
</body>
</html>
